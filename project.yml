name: MusicTeacherStudio
options:
  bundleIdPrefix: com.jiang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: zh-Hant
targets:
  MusicTeacherStudio:
    type: application
    platform: iOS
    sources:
      - path: MusicTeacherStudio
        excludes:
          - "Resources/Info.plist"
    resources:
      - MusicTeacherStudio/Resources/Assets.xcassets
      - MusicTeacherStudio/Resources/Configuration.storekit
    info:
      path: MusicTeacherStudio/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        CFBundleDisplayName: 樂課管家
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiang.musicteacherstudio
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MusicTeacherStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MusicTeacherStudioTests
    dependencies:
      - target: MusicTeacherStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiang.musicteacherstudio.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MusicTeacherStudio:
    build:
      targets:
        MusicTeacherStudio: all
        MusicTeacherStudioTests: [test]
    test:
      targets:
        - MusicTeacherStudioTests
    run:
      config: Debug
